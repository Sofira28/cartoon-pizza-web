<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cartoon Pizza - Módulo de Cocina</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Comic+Neue:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/styles.css">
    <script src="https://cdn.jsdelivr.net/npm/socket.io-client@4.8.3/dist/socket.io.min.js"></script>
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark navbar-custom chess-pattern">
        <div class="container-fluid">
            <a class="navbar-brand d-flex align-items-center" href="#">
                <i class="bi bi-stars me-2"></i>
                <img src="assets/images/LogoPizza.png" class="logo-img" alt="Cartoon Pizza">
            </a>
            <div class="d-flex">
                <span class="navbar-text me-3">
                    <i class="bi bi-person-circle me-1"></i>Chef: <span id="nombreUsuario">Cargando...</span>
                </span>
                <button class="btn btn-danger"onclick="cerrarSesion()">
                    <i class="bi bi-box-arrow-right me-1"></i>Cerrar Sesión
                </button>
            </div>
        </div>
    </nav>

    <div class="container-fluid mt-4">
        <div class="row">
            <!-- Panel principal de pedidos -->
            <div class="col-md-9">
                <div class="card cartoon-shadow">
                    <div class="card-header back titulo-chess d-flex justify-content-between align-items-center">
                        <span><i class="bi bi-list-check me-1"></i>Pedidos en Curso</span>
                        <div>
                            <button class="btn btn-sm filter-btn active" data-status="all">
                                Todos
                            </button>
                            <button class="btn btn-sm filter-btn" data-status="pending">
                                Pendientes
                            </button>
                            <button class="btn btn-sm filter-btn" data-status="preparing">
                                En Preparación
                            </button>
                            <button class="btn btn-sm filter-btn" data-status="ready">
                                Listos
                            </button>
                        </div>
                    </div>
                    <div class="card-body">
                        <div class="row orders-container" id="contenedorPedidos">
                        </div>
                    </div>
                </div>
            </div>
            
            <!-- Panel de estadísticas y controles -->
            <div class="col-md-3">
                <div class="kitchen-stats mb-4">
                    <h5 class="mb-3" style="font-family: 'Bangers', cursive; color: var(--color-red);">
                        <i class="bi bi-speedometer2 me-2"></i>Estadísticas
                    </h5>
                    <div class="row text-center">
                        <div class="col-6 mb-3">
                            <div class="stat-value" id="contadorPendientes">0</div>
                            <div class="stat-label">Pendientes</div>
                        </div>
                        <div class="col-6 mb-3">
                            <div class="stat-value" id="contadorPreparacion">0</div>
                            <div class="stat-label">En Preparación</div>
                        </div>
                        <div class="col-6">
                            <div class="stat-value" id="contadorListos">0</div>
                            <div class="stat-label">Listos</div>
                        </div>
                        <div class="col-6">
                            <div class="stat-value" id="tiempoPromedio">0m</div>
                            <div class="stat-label">Tiempo Promedio</div>
                        </div>
                    </div>
                </div>
                
                <div class="card cartoon-shadow">
                    <div class="card-header back titulo-chess">
                        <i class="bi bi-bell me-1"></i>Notificaciones
                    </div>
                    <div class="card-body" id="contenedorNotificaciones">
                        <div class="alert-kitchen alert-info-kitchen">
                            <small><i class="bi bi-info-circle me-1"></i>Sistema conectado</small>
                        </div>
                    </div>
                </div>
                
                <div class="card cartoon-shadow mt-3">
                    <div class="card-header back titulo-chess">
                        <i class="bi bi-gear me-1"></i>Acciones Rápidas
                    </div>
                    <div class="card-body">
                        <button class="btn btn-outline-kitchen btn-kitchen" onclick="cargarPedidos()">
                            <i class="bi bi-arrow-clockwise me-1"></i>Actualizar Pedidos
                        </button>
                        <button class="btn btn-outline-kitchen btn-kitchen" onclick="marcarTodosListos()">
                            <i class="bi bi-check2-circle me-1"></i>Marcar Todos Listos
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- ventana de detalles del pedido -->
    <div class="modal fade" id="modalDetallePedido" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-lg">
            <div class="modal-content" style="border: 3px solid var(--color-black); border-radius: 15px;">
                <div class="modal-header chess-pattern text-white">
                    <h5 class="modal-title" style="font-family: 'Bangers', cursive; font-size: 1.5rem;">
                        Detalles del Pedido - Mesa <span id="numeroMesaModal"></span>
                    </h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <div>
                            <span class="badge status-badge" id="badgeEstadoModal">Pendiente</span>
                            <span class="ms-2 text-muted" id="tiempoPedidoModal">Hace 0 minutos</span>
                        </div>
                        <div class="timer fs-5" id="temporizadorModal">00:00:00</div>
                    </div>
                    
                    <div class="order-item mb-3">
                        <i class="bi bi-chat-dots me-1"></i>
                        <span id="notasModal">Sin observaciones especiales</span>
                    </div>
                    
                    <h6 style="font-family: 'Bangers', cursive; color: var(--color-red);">Items del Pedido:</h6>
                    <div id="listaItemsModal">
                        <!-- Items del pedido -->
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cerrar</button>
                    <button type="button" class="btn btn-primary" id="botonCambiarEstado" style="background-color: var(--color-orange); border-color: var(--color-black);">Cambiar Estado</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/config.js"></script>
    <script src="assets/js/api.js"></script>
    <script src="assets/js/main.js"></script>
    <script src="assets/js/cocina.js"></script>
</body>
</html>
