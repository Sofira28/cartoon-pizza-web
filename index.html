<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cartoon Pizza - Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Comic+Neue:wght@400;700&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" href="assets/images/LogoPizza.png">
    <meta name="theme-color" content="#1a1a1a">
    <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body class="login-page">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-5">
                <div class="login-container">
                    <div class="login-header">
                        <img src="assets/images/LogoLogin2.png" class="logo-img-login" alt="Cartoon Pizza">
                        <h5 class="text-center">¡Bienvenido a Pizza Cartoon!</h5>
                    </div>
                    
                    <div class="login-body">
                        <ul class="nav nav-tabs nav-justified mb-4" id="authTabs" role="tablist">
                            <li class="nav-item" role="presentation">
                                <button class="nav-link active" id="login-tab" data-bs-toggle="tab" data-bs-target="#login" type="button" role="tab">Iniciar Sesión</button>
                            </li>
                            <li class="nav-item" role="presentation">
                                <button class="nav-link" id="register-tab" data-bs-toggle="tab" data-bs-target="#register" type="button" role="tab">Registrarse</button>
                            </li>
                        </ul>

                        <div class="tab-content" id="authTabsContent">
                            <!-- Inicio sesión-->
                            <div class="tab-pane fade show active" id="login" role="tabpanel">
                                <div id="loginAlert" class="alert alert-danger d-none"></div>
                                
                                <!-- Botón de Google para Login -->
                                <button class="btn btn-google mb-3" onclick="iniciarSesionGoogle()">
                                    <img src="https://developers.google.com/identity/images/g-logo.png" alt="Google">
                                    Continuar con Google
                                </button>
                                
                                <div class="divider mb-3">
                                    <span>o ingresa con tu email</span>
                                </div>
                                
                                <form id="loginForm">
                                    <div class="mb-3">
                                        <input type="email" class="form-control" id="loginEmail" placeholder="Correo electrónico" required>
                                    </div>
                                    <div class="mb-3">
                                        <input type="password" class="form-control" id="loginPassword" placeholder="Contraseña" required>
                                    </div>
                                    <button type="submit" class="btn btn-login">
                                        <i class="bi bi-box-arrow-in-right me-2"></i>Iniciar Sesión
                                    </button>
                                </form>
                            </div>

                            <!-- Registro -->
                            <div class="tab-pane fade" id="register" role="tabpanel">
                                <div id="registerAlert" class="alert alert-danger d-none"></div>
                                
                                <!-- Botón de Google para Registro -->
                                <button class="btn btn-google mb-3" onclick="registrarConGoogle()">
                                    <img src="https://developers.google.com/identity/images/g-logo.png" alt="Google">
                                    Registrarse con Google
                                </button>
                                
                                <div class="divider mb-3">
                                    <span>o registrate con tu email</span>
                                </div>
                                
                                <form id="registerForm">
                                    <div class="mb-3">
                                        <input type="text" class="form-control" id="registerName" placeholder="Nombre completo" required>
                                    </div>
                                    <div class="mb-3">
                                        <input type="email" class="form-control" id="registerEmail" placeholder="Correo electrónico" required>
                                    </div>
                                    <div class="mb-3">
                                        <select class="form-control" id="registerRole" required>
                                            <option value="">Seleccionar rol</option>
                                            <option value="mesero">Mesero</option>
                                            <option value="cocina">Cocina</option>
                                            <option value="caja">Caja</option>
                                        </select>
                                    </div>
                                    <div class="mb-3">
                                        <input type="password" class="form-control" id="registerPassword" placeholder="Contraseña" required minlength="8">
                                    </div>
                                    <div class="mb-3">
                                        <input type="password" class="form-control" id="registerConfirmPassword" placeholder="Confirmar contraseña" required>
                                    </div>
                                    <button type="submit" class="btn btn-login">
                                        <i class="bi bi-person-plus me-2"></i>Registrarse
                                    </button>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/config.js"></script>
    <script src="assets/js/api.js"></script>
    <script src="assets/js/main.js"></script>
    <script src="assets/js/login.js"></script>
</body>
</html>
