<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Completar Registro - Cartoon Pizza</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Comic+Neue:wght@400;700&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" href="assets/images/LogoPizza.png">
    <meta name="theme-color" content="#1a1a1a">
    <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body class="login-page">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="login-container">
                    <div class="login-header">
                        <img src="assets/images/LogoLogin2.png" class="logo-img-login" alt="Cartoon Pizza">
                        <h5 class="text-center">¡Completa tu registro!</h5>
                        <p class="text-center text-white mb-0">Hola <span id="userName" class="fw-bold"></span>, selecciona tu rol en el sistema</p>
                    </div>
                    
                    <div class="login-body">
                        <div id="registrationAlert" class="alert alert-danger d-none"></div>
                        
                        <form id="completeRegistrationForm">
                            <div class="mb-4">
                                <label class="form-label fw-bold">Selecciona tu rol:</label>
                                <div class="role-options">
                                    <div class="form-check mb-3 p-3 role-option">
                                        <input class="form-check-input" type="radio" name="role" id="roleMesero" value="mesero" required>
                                        <label class="form-check-label fw-bold w-100" for="roleMesero">
                                            <i class="bi bi-person-check me-2"></i>
                                            <strong>Mesero/a</strong>
                                            <small class="d-block text-muted">Atención al cliente, toma de pedidos y gestión de mesas</small>
                                        </label>
                                    </div>
                                    
                                    <div class="form-check mb-3 p-3 role-option">
                                        <input class="form-check-input" type="radio" name="role" id="roleCocina" value="cocina" required>
                                        <label class="form-check-label fw-bold w-100" for="roleCocina">
                                            <i class="bi bi-egg-fried me-2"></i>
                                            <strong>Cocina</strong>
                                            <small class="d-block text-muted">Preparación de alimentos y gestión de órdenes de cocina</small>
                                        </label>
                                    </div>
                                    
                                    <div class="form-check mb-3 p-3 role-option">
                                        <input class="form-check-input" type="radio" name="role" id="roleCaja" value="caja" required>
                                        <label class="form-check-label fw-bold w-100" for="roleCaja">
                                            <i class="bi bi-cash-coin me-2"></i>
                                            <strong>Caja</strong>
                                            <small class="d-block text-muted">Gestión de pagos, facturación y cierre de caja</small>
                                        </label>
                                    </div>
                                </div>
                            </div>
                            
                            <button type="submit" class="btn btn-login w-100">
                                <i class="bi bi-check-circle me-2"></i>Completar Registro
                            </button>
                        </form>
                        
                        <div class="text-center mt-3">
                            <small class="text-muted">
                                Al completar el registro, aceptas los términos y condiciones del sistema
                            </small>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/config.js"></script>
    <script src="assets/js/api.js"></script>
    <script src="assets/js/registro-google.js"></script>
</body>
</html>
